<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Plantão Regional</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: estação de trabalho médica. Fila de rostos no topo, paciente em pixel art à esquerda, documentos à direita, carimbos de destino embaixo. Visual único e escuro, como a mesa de um plantão noturno. */
:root{
  --bg:#1b211e;--bg2:#242c28;--panel:#2e3833;--panel2:#3a463f;--paper:#ddd5b6;--paper2:#cfc6a2;--ink:#23211b;--ink2:#5d5846;
  --fg:#e8e2c8;--fg2:#a9b0a3;--amber:#ecb44a;--red:#d24a36;--green:#6aa86f;--blue:#5b8dc0;--line:#0d120f;
  --tc-VERMELHO:#d24a36;--tc-LARANJA:#e0873a;--tc-AMARELO:#e6c844;--tc-VERDE:#5fae68;--tc-AZUL:#5b8dc0;
  --px:'VT323','Courier New',monospace;--hd:'Press Start 2P','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--px);font-size:20px;line-height:1.15;
  padding-block:10px 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px)}
button,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
[hidden]{display:none!important}
.app{max-width:1180px;margin:0 auto;display:grid;gap:10px;min-width:0}
.px{border:2px solid var(--line);box-shadow:inset 0 0 0 2px rgba(255,255,255,.06),3px 3px 0 var(--line)}
.top{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--panel);padding:8px 10px}
.brand{font-family:var(--hd);font-size:12px;line-height:1.5;color:var(--amber);letter-spacing:.04em}
.brand small{display:block;font-family:var(--px);font-size:17px;color:var(--fg2);letter-spacing:0}
.lcd{font-family:var(--hd);font-size:20px;color:var(--amber);background:#0b100d;padding:7px 10px;letter-spacing:.08em;text-shadow:0 0 6px rgba(236,180,74,.4)}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#141a17;border:2px solid var(--line);padding:2px 7px;font-size:18px;white-space:nowrap}
.chip b{color:var(--amber);font-weight:400}
.chip.full{border-color:var(--red);color:#f0a79b}
.meter{display:flex;gap:6px;align-items:center;font-size:17px;color:var(--fg2)}
.meter i{display:block;width:60px;height:8px;background:#141a17;border:1px solid var(--line)}
.meter i b{display:block;height:100%;background:var(--green)}
.alerts{flex:1 1 260px;min-width:0;font-size:17px;color:var(--fg2);display:grid;gap:1px}
.alerts div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alerts .hot{color:#f0a79b}
.btn{background:var(--panel2);border:2px solid var(--line);box-shadow:3px 3px 0 var(--line);padding:5px 10px;min-height:36px}
.btn:hover:not(:disabled){background:#4a594f}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn.amber{background:#8a6420;color:#fff3d0}
.btn.red{background:#8a2e22;color:#ffe2dc}
.queue{display:flex;gap:8px;overflow-x:auto;padding:8px;background:var(--bg2);min-height:98px;align-items:stretch}
.qempty{align-self:center;color:var(--fg2);display:flex;gap:10px;align-items:center}
.qc{flex:none;width:136px;background:var(--panel);border:2px solid var(--line);border-top:7px solid var(--tc);padding:4px;text-align:left;display:grid;grid-template-columns:48px 1fr;gap:5px;color:var(--fg);box-shadow:3px 3px 0 var(--line)}
.qc[aria-pressed=true]{background:#4f5f50;outline:2px solid var(--amber)}
.qc canvas{width:48px;height:48px;image-rendering:pixelated;background:#7f9886}
.qc span{font-size:16px;line-height:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.qc em{grid-column:1/-1;font-style:normal;font-size:15px;color:var(--fg2);display:flex;gap:4px;flex-wrap:wrap}
.qc em u{text-decoration:none;background:#141a17;padding:0 4px;color:var(--amber)}
.work{display:grid;gap:10px;grid-template-columns:minmax(0,1fr);align-items:start}
@media(min-width:920px){.work{grid-template-columns:minmax(0,410px) minmax(0,1fr)}}
.left,.right{display:grid;gap:10px;min-width:0}
.scene canvas{width:100%;height:auto;aspect-ratio:4/3;image-rendering:pixelated;display:block;background:#7f9886}
.doc{background:var(--paper);color:var(--ink);padding:10px 12px;position:relative;min-width:0}
.doc h3{font-family:var(--hd);font-size:10px;font-weight:400;margin:0 0 8px;padding-bottom:5px;border-bottom:2px solid var(--ink);letter-spacing:.04em;line-height:1.4;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.doc h3 span{font-family:var(--px);font-size:17px;letter-spacing:0;color:var(--ink2)}
.idn{font-size:24px;line-height:1}
.dl{display:grid;gap:3px;margin-top:6px}
.dl div{display:grid;grid-template-columns:88px minmax(0,1fr);gap:6px;border-bottom:1px dotted #a29a7a;padding-bottom:2px}
.dl dt{font-size:16px;text-transform:uppercase;color:var(--ink2)}
.dl dd{margin:0;overflow-wrap:anywhere}
.dl .unk{color:#8a8368;font-style:italic}
.stamp{position:absolute;right:10px;top:40px;border:3px double currentColor;padding:2px 8px;font-family:var(--hd);font-size:9px;transform:rotate(-6deg);opacity:.9;line-height:1.5;text-align:center;mix-blend-mode:multiply;pointer-events:none}
.vit{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:6px}
.v{border:2px solid var(--ink);padding:3px 5px;background:rgba(255,255,255,.3)}
.v label{display:block;font-size:15px;color:var(--ink2);text-transform:uppercase}
.v b{font-size:26px;font-weight:400;line-height:1}
.v small{font-size:15px;color:var(--ink2)}
.v.abn b{color:#b02a1a}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.btn.paper{background:var(--paper2);color:var(--ink);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.btn.paper:hover:not(:disabled){background:#e6dfc3}
.btn.paper.on{background:var(--ink);color:var(--paper)}
.tabs{display:flex;flex-wrap:wrap;gap:3px}
.tab{font-family:var(--hd);font-size:9px;padding:8px 9px;background:var(--panel);border:2px solid var(--line);border-bottom:0;color:var(--fg2)}
.tab[aria-selected=true]{background:var(--paper);color:var(--ink)}
.sheet{border:2px solid var(--line);min-height:300px}
.qa{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.qa li{border-left:4px solid var(--ink2);padding-left:8px}
.qa li b{font-weight:400;color:var(--ink2)}
.qa .new{border-color:#b02a1a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:6px}
.opt{text-align:left;display:grid;gap:0;line-height:1.05;padding:5px 7px}
.opt small{font-size:15px;color:var(--ink2)}
.opt.on small{color:#cfc8ad}
.sub{font-family:var(--hd);font-size:9px;margin:12px 0 6px;color:var(--ink2);font-weight:400}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.form label{display:grid;gap:2px;font-size:16px;color:var(--ink2);text-transform:uppercase;min-width:0}
.form select,textarea{background:#efe9d1;color:var(--ink);border:2px solid var(--ink);padding:4px;min-width:0;width:100%}
textarea{min-height:70px;resize:vertical}
.rxl{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.rxl li{border:2px dashed var(--ink2);padding:3px 6px}
.warn{color:#9c2a1a}
.good{color:#2f6a3a}
.decide{background:var(--panel);padding:8px 10px;display:grid;gap:8px}
.decide h4{font-family:var(--hd);font-size:9px;font-weight:400;margin:0;color:var(--fg2)}
.dests{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px}
.dest{border:3px double var(--fg2);background:transparent;padding:6px 4px;font-family:var(--hd);font-size:8px;line-height:1.5;color:var(--fg);min-height:52px;text-transform:uppercase}
.dest small{display:block;font-family:var(--px);font-size:16px;text-transform:none;color:var(--fg2)}
.dest[aria-pressed=true]{background:var(--amber);color:#2a1d05;border-color:#2a1d05}
.dest[aria-pressed=true] small{color:#4a3510}
.dest:disabled{opacity:.4}
.orient{display:flex;flex-wrap:wrap;gap:6px}
.orient label{background:#141a17;border:2px solid var(--line);padding:3px 8px;display:flex;gap:5px;align-items:center}
.veil{position:fixed;inset:0;background:rgba(6,9,7,.82);z-index:30;overflow:auto;display:grid;place-items:start center;padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.card{max-width:700px;width:100%;margin-block:8px}
.big{font-family:var(--hd);font-size:18px;line-height:1.5;margin:4px 0 10px}
.card p{margin:6px 0}
.card ul{margin:6px 0;padding-left:20px}
.rep{display:grid;gap:8px;margin-top:8px}
.rp{border:2px solid var(--ink);padding:6px 8px;background:rgba(255,255,255,.25)}
.rp h4{margin:0 0 2px;font-weight:400;font-size:22px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tag{font-family:var(--hd);font-size:8px;padding:3px 6px;border:2px solid currentColor;line-height:1}
.t-otimo,.t-bom{color:#2f6a3a}.t-parcial{color:#8a6420}.t-ruim,.t-obito,.t-pend{color:#9c2a1a}
.foot{font-size:16px;color:var(--fg2);max-width:80ch}
.hint{color:var(--fg2);font-size:18px;padding:18px}
.musbox{display:grid;gap:4px;min-width:0;max-width:260px}
.musbox label{font-size:15px;color:var(--fg2);text-transform:uppercase;letter-spacing:.06em}
.musbox select{background:#141a17;color:var(--fg);border:2px solid var(--line);padding:3px 4px;font-family:var(--px);font-size:17px;min-width:0;width:100%}
.np{font-size:15px;color:var(--amber);min-height:16px;overflow-wrap:anywhere}
.grid.mov{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.grid.mov .opt{overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="top px" id="top"></header>
<section class="queue px" id="queue" aria-label="Fila de pacientes"></section>
<main class="work" id="work"></main>
<footer class="decide px" id="decide" hidden></footer>
<p class="foot">Simulação educacional com casos fictícios. Doses e condutas simplificadas a partir de diretrizes brasileiras e da RENAME; não substituem protocolos institucionais nem a supervisão do preceptor.</p>
</div>
<div class="veil" id="veil" hidden></div>
<script>

 furo:{n:'Furosemida',v:['EV'],d:['20 mg','40 mg','80 mg','160 mg em bolus'],tox:3,ae:'Hipovolemia e hipocalemia: PA 80/50 e extrassístoles ventriculares.',f:'u s8 s12',dr:'u h24 ct'},

 morf:{n:'Morfina',v:['EV'],d:['2 mg','4 mg','10 mg'],tox:2,ae:'Depressão respiratória: FR 8 irpm e SatO2 82%.',f:'u s6 sn',dr:'u h24'},

 enox:{n:'Enoxaparina',v:['SC/EV'],d:['20 mg SC','30 mg EV + 1 mg/kg SC','2 mg/kg SC'],tox:2,ae:'Hemorragia: hematoma volumoso e queda da Hb.',f:'s12 s24 u',dr:'ct d3 d5'},

 kcl:{n:'Cloreto de potássio',v:['EV'],d:['10 mEq em 1 h','20 mEq em 1 h','40 mEq em bolus'],tox:2,ae:'Hipercalemia aguda: bradicardia e risco de parada.',f:'u ic',dr:'u ct h24'},
 bic:{n:'Bicarbonato de sódio',v:['EV'],d:['50 mEq','100 mEq','200 mEq'],f:'u',dr:'u'},

/* c: custo em insumos · t: minutos até o resultado */

 trop:{n:'Troponina',t:60,c:4},eletr:{n:'Sódio e potássio',t:40,c:2},cr:{n:'Ureia e creatinina',t:40,c:2},
 coag:{n:'Coagulograma (TC/INR)',t:50,c:3},urina:{n:'Urina tipo I',t:35,c:2},hemoc:{n:'Hemoculturas',t:30,c:3},

};
const SYS=[['geral','Aspecto geral'],['cab','Cabeça e pescoço'],['cardio','Cardiovascular'],['resp','Respiratório'],['abd','Abdome'],['neuro','Neurológico'],['ext','Extremidades e pele']];
const DXS=[['ans','Crise de ansiedade'],['avc','AVC isquêmico'],['cad','Cetoacidose diabética'],['cel','Celulite / erisipela'],['dengue','Dengue com sinais de alarme'],['dis','Dissecção de aorta'],['dpoc','Exacerbação de DPOC'],['eap','Edema agudo de pulmão (ICC descompensada)'],['eh','Encefalopatia hepática'],['gea','Gastroenterite aguda'],['hda','Hemorragia digestiva alta varicosa'],['hipo','Hipoglicemia'],['iam','IAM com supra de ST'],['sca','Angina instável / IAM sem supra'],['ofid','Acidente botrópico'],['pan','Pancreatite aguda'],['pneu','Pneumonia comunitária'],['sepse','Sepse de foco urinário'],['tb','Tuberculose pulmonar'],['tep','Tromboembolismo pulmonar'],['ulc','Úlcera péptica complicada'],['has','Urgência hipertensiva']];
const DESTS=[['ALTA','Alta hospitalar'],['OBS','Observação'],['ENF','Enfermaria'],['EMG','Sala de emergência'],['UTI','UTI'],['TRANS','Transferência regulada']];
const ORIENT=[['sinais','Sinais de alarme e quando retornar'],['med','Medicações em uso explicadas'],['ubs','Retorno à UBS em 7 dias'],['enc','Encaminhamentos e atestado']];
const GEN_Q=[['comorb','Tem alguma doença ou já se internou antes?'],['uso','Que medicamentos usa?'],['alerg','Tem alergia a algum medicamento?'],['drogas','Usa álcool, cigarro ou outras drogas?'],['dor','De 0 a 10, quanto está a dor?'],['cirurgias','Já fez cirurgia ou internação recente?'],['familia','Tem doença na família?'],['vacinas','As vacinas estão em dia, incluindo a antitetânica?'],['ultima','Quando e o que comeu por último?'],['viagem','Viajou ou teve contato com alguém doente?'],['trabalho','Teve alguma exposição no trabalho (veneno, poeira, animais)?']];

Object.assign(DRUGS,{
 atrop:{n:'Atropina',v:['EV'],d:['0,5 mg','1 mg','2–5 mg, dobrando a cada 5 min até atropinização','10 mg em bolus'],tox:3,ae:'Taquicardia extrema, delirium e hipertermia anticolinérgica.',f:'u ic',dr:'u ct'},

function order(P,id,free){
  const E=EXAMS[id];if(P.ord[id])return'Já solicitado.';
  const off=G.off[id];if(off&&G.t<off.until)return off.why;
  if(G.ins<E.c)return'Insumos insuficientes para este exame.';
  G.ins-=E.c;P.ord[id]={t0:G.t,due:G.t+E.t,done:E.t<=1};
  if(!P.c.util.includes(id)&&id!=='glic'&&id!=='ecg'){P.pen.push([2,'Exame sem indicação: '+E.n+'.'])}
  if(E.t<=1)P.newRes++;

}

function rxAdd(P,f,free){
  const id=f.drug,D=DRUGS[id],c=P.c,i=f.dose;
  if(!D)return'Escolha um medicamento.';
  if(id==='o2')P.rx=P.rx.filter(r=>r.id!=='o2');else if(P.rx.some(r=>r.id===id))return'Já prescrito para este paciente.';
  if(c.stock&&c.stock[id]!=null||G.stock[id]!=null){
    const need=id==='sorobot'?[2,4,8,12][i]:id==='hemac'?[1,2,4][i]:0;
    if(G.stock[id]!=null&&need>G.stock[id])return'Estoque insuficiente: restam '+G.stock[id]+' unidades. Escolha uma dose menor ou solicite reposição pela regulação.';
    if(G.stock[id]!=null)G.stock[id]-=need;
  }
  const rx={id,i,via:f.via,freq:f.freq,dur:f.dur,t:G.t};
  /* alergia */
  if(D.al&&c.alergia.includes(D.al))addAE(P,c.alergiaMsg||'Reação alérgica grave.',40,'Medicação da classe a que o paciente tem alergia grave: '+D.n+'.'),P.adv.push(G.t);
  let handled=false;const ct=c.contra[id];
  if(ct){const from=typeof ct==='string'?0:ct.from,t=typeof ct==='string'?ct:ct.t;if(i>=from){addAE(P,t,20,'Medicação contraindicada ou perigosa neste caso: '+D.n+'.');handled=true}}
  (c.seq||[]).forEach(s=>{if(id===s.then&&!P.rx.some(r=>r.id===s.first)){addAE(P,s.t,20,'Ordem errada de condutas: '+D.n+' antes de '+DRUGS[s.first].n+'.');handled=true}});
  const ev=isEVrx(D,f.via);
  if(ev){const dd=dlDefault(id);rx.dil=f.dil||dd.dil;rx.inf=f.inf||dd.inf;const R=DL[id];
    if(R){if(R.bad&&R.bad[rx.dil]){if(!handled)addAE(P,R.bad[rx.dil],20,'Diluição perigosa: '+D.n+' em '+DIL[rx.dil]+'.');handled=true}
      else if(R.ok&&!R.ok.includes(rx.dil))P.pen.push([3,'Diluição inadequada: '+D.n+' ('+DIL[rx.dil]+').']);
      if(R.ibad&&R.ibad[rx.inf]){if(!handled)addAE(P,R.ibad[rx.inf],20,'Velocidade de infusão perigosa: '+D.n+'.');handled=true}
      else if(R.ineff&&R.ineff.includes(rx.inf)){P.pen.push([6,R.ineffT||'Infusão ineficaz: '+D.n+'.']);handled=true}
      else if(R.iok&&!R.iok.includes(rx.inf))P.pen.push([3,'Tempo de infusão inadequado: '+D.n+' ('+INF[rx.inf]+').'])}
    if(f.freq==='ic'&&rx.inf!=='cont')P.pen.push([3,'Infusão contínua precisa correr em bomba: '+D.n+'.'])}
  let isKey=false;
  c.key.forEach((k,ki)=>{
    if(!k.ids.includes(id))return;isKey=true;
    const ok=okIdx(k,id);
    if(ok.includes(i)){if(P.ks[ki]==null&&!handled)P.ks[ki]=G.t}
    else if(i>Math.max(...ok)){if(!handled){addAE(P,D.ae||'Dose acima da recomendada.',12,'Dose acima da recomendada: '+D.n+'.');handled=true}}
    else if(id!=='o2')P.pen.push([6,'Dose insuficiente: '+D.n+'.']);
  });
  if(!isKey&&!handled){
    if(c.allowed.includes(id)||id==='o2'){if(D.tox!=null&&i>=D.tox)addAE(P,D.ae,12,'Dose acima da recomendada: '+D.n+'.')}
    else if(['iot','cvc','dreno','parac','cardiov','desfib'].includes(id))addAE(P,'Procedimento invasivo sem indicação: '+D.n.toLowerCase()+' com complicação (sangramento, pneumotórax, infecção ou lesão de via aérea).',20,'Procedimento invasivo sem indicação: '+D.n+'.');
    else{P.pen.push([6,'Prescrição sem indicação: '+D.n+'.']);G.ins=Math.max(0,G.ins-1)}
  }
  if(!D.f.split(' ').includes(f.freq)||!D.dr.split(' ').includes(f.dur))P.pen.push([3,'Frequência ou duração inadequada: '+D.n+'.']);
  P.rx.push(rx);
  if(/EV/.test(D.v[f.via||0])&&P.mov.ace==null){P.mov.ace=G.t;P.log.push({t:G.t,k:'m',q:'Enfermagem',a:'Acesso venoso puncionado para a medicação EV.',fresh:1})}
  adv(free?0:1);return null;
}

function canGo(d){
  if(d==='UTI')return bedFree('uti')>0?null:'Sem leito de UTI. Mantenha na sala de emergência ou solicite transferência regulada.';
  if(d==='ENF')return bedFree('enf')>0?null:'Enfermaria lotada.';
  if(d==='OBS')return bedFree('obs')>0?null:'Observação lotada.';
  if(d==='AMA')return bedFree('ama')>0?null:'Sala amarela lotada.';

}
function commit(P,d){

  finalize(P,d);if(G.act===P.id)G.act=null;adv(2);return null;
}

function finalize(P,d,fromReg){
  const c=P.c;
  if(!fromReg){ if(d==='UTI')G.beds.uti.used++;if(d==='ENF')G.beds.enf.used++;if(d==='OBS')G.beds.obs.used++;if(d==='AMA')G.beds.ama.used++ }
  const pen=P.pen.slice(),good=P.good.slice(),goods=[];
  const best=c.dest.best.includes(d),okd=c.dest.ok.includes(d);
  if(best)goods.push('Destino adequado: '+DESTS.find(x=>x[0]===d)[1]+'.');else if(okd)pen.push([8,'Destino aceitável, mas não o melhor: '+DESTS.find(x=>x[0]===d)[1]+'.']);
  else pen.push([35,'Destino inadequado: '+DESTS.find(x=>x[0]===d)[1]+'.']);
  if(d==='ALTA'&&!c.dest.alta){pen.push([60,'Alta insegura de paciente que exigia internação.']);G.unsafe++}
  if(d==='ALTA'&&c.dest.alta&&P.orient.size>=2)goods.push('Alta com orientações registradas.');
  c.key.forEach((k,i)=>{if(P.ks[i]==null)pen.push([15,'Faltou: '+k.lb+'.']);else goods.push('Feito: '+k.lb+'.')});
  if(!P.hyp)pen.push([15,'Hipótese diagnóstica não registrada.']);
  else if(P.hyp!==c.hyp)pen.push([15,'Diagnóstico perdido: a hipótese registrada foi "'+DXS.find(x=>x[0]===P.hyp)[1]+'".']);
  else if(c.evid.length&&!c.evid.some(e=>P.ord[e]&&P.ord[e].done))pen.push([5,'Diagnóstico correto, mas empírico, sem exame que o confirmasse.']);
  else goods.push('Diagnóstico correto: '+DXS.find(x=>x[0]===c.hyp)[1]+'.');
  if(P.asked.size>=4)goods.push('Anamnese dirigida.');
  if(P.seen!=null){const w=Math.round(P.seen-c.arr);if(c.tri==='VERMELHO'&&w>12)pen.push([10,'Atendimento tardio de paciente vermelho (espera de '+w+' min).']);else if(c.tri==='LARANJA'&&w>25)pen.push([5,'Atendimento tardio de paciente laranja (espera de '+w+' min).'])}
  if(c.tri==='VERMELHO'||c.tri==='LARANJA'){if(P.mov.mon==null)pen.push([8,'Paciente grave sem monitorização.']);else goods.push('Paciente grave monitorizado.');if(P.mov.ace==null)pen.push([6,'Paciente grave sem acesso venoso.'])}
  if(P.worst<=-2)pen.push([20,'Deterioração clínica importante durante o atendimento.']);else if(P.worst===-1)pen.push([8,'Piora clínica durante o atendimento.']);
  if(d==='TRANS'&&P.stage<0)pen.push([25,'Transferido ainda instável.']);
  let sc=100;const errs=[];pen.forEach(([p,t])=>{sc-=p;errs.push(t)});sc=clamp(sc);
  const cls=sc>=85?'otimo':sc>=65?'bom':sc>=40?'parcial':'ruim';
  const txt=cls==='otimo'||cls==='bom'?c.out.ok:cls==='parcial'?c.out.part:c.out.bad;
  P.dest=d;P.st='done';P.res={cls,score:sc,txt,errs,goods};scheduleFate(P,d);
  G.rep=clamp(G.rep+(sc-60)/8);G.eq=clamp(G.eq+(sc-60)/12);
  if(window.sfx)sfx(cls==='otimo'||cls==='bom'?'good':cls==='parcial'?'mid':'bad');
}

function resolveDil(n){

function endShift(){
  if(G.over)return;G.over=true;G.sched.forEach(it=>deliver(it,true));G.sched=[];
  G.pts.forEach(P=>{
    if(ACTIVE.includes(P.st)||P.st==='wait'){
      if(P.st==='wait'){P.st='skip';P.res={cls:'pend',score:0,txt:'Não chegou antes do fim do plantão.',errs:[],goods:[]};return}
      let sc=100;const errs=['Passagem de plantão sem desfecho definido.'];sc-=25;
      P.pen.forEach(([p,t])=>{sc-=p;errs.push(t)});
      P.c.key.forEach((k,i)=>{if(P.ks[i]==null){sc-=15;errs.push('Faltou: '+k.lb+'.')}});
      if(P.stage<0){sc-=15;errs.push('Passou o plantão em piora clínica.')}
      P.res={cls:'pend',score:clamp(sc),txt:'Paciente entregue ao plantão seguinte sem desfecho.',errs,goods:[]};P.st='handoff';
    }
  });
  const list=G.pts.filter(p=>p.st!=='skip'),avg=list.length?Math.round(list.reduce((a,p)=>a+p.res.score,0)/list.length):0;
  const score=clamp(Math.round(avg*.8+G.rep*.1+G.eq*.1-G.unsafe*3));
  G.final={avg,score,dead:G.pts.filter(p=>p.st==='dead').length,unsafe:G.unsafe,exams:G.pts.reduce((a,p)=>a+p.pen.filter(x=>/^Exame sem/.test(x[1])).length,0),
    rx:G.pts.reduce((a,p)=>a+p.pen.filter(x=>/Prescrição sem|Dose|Medicação|Frequência|Ordem errada/.test(x[1])).length,0),
    missed:G.pts.reduce((a,p)=>a+(p.res&&p.res.errs.some(e=>/Diagnóstico perdido|Hipótese diagnóstica não/.test(e))?1:0),0),
    missing:G.slots.length-G.filled,right:G.pts.reduce((a,p)=>a+(p.res?p.res.goods.length:0),0)};
  try{const s=JSON.parse(localStorage.getItem('pr_save')||'{"shifts":[]}');s.shifts.push({n:G.n,score,rep:Math.round(G.rep)});localStorage.setItem('pr_save',JSON.stringify(s));localStorage.removeItem('pr_cur')}catch(e){}
  if(window.sfx)sfx('bell');
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(x){}}
  if(AC&&AC.state==='suspended')AC.resume();
  const a=b.dataset.a,i=a.indexOf(':'),k=i<0?a:a.slice(0,i),v=i<0?'':a.slice(i+1);
  if(k==='snd'){UI.snd=!UI.snd;render();return}
  if(k==='mus'){MUS.on=!MUS.on;render();return}
  if(k==='news'){UI.news=true;if(G)G.unread=0;render();return}
  if(k==='closenews'){UI.news=false;render();return}
  sfx('click');
  if(k==='menu'){UI.menu=true;UI.confirmReset=false;render();return}
  if(k==='closemenu'){UI.menu=false;UI.confirmReset=false;render();return}
  if(k==='cont'){if(!loadGame())UI.msg2='Não foi possível carregar o plantão salvo.';render();return}
  if(k==='reset'){UI.confirmReset=true;render();return}
  if(k==='resetno'){UI.confirmReset=false;render();return}
  if(k==='resetok'){resetAll();render();return}
  if(k==='start'){UI.news=false;UI.menu=false;UI.confirmReset=false;newShift(nextN(),v||'local');UI.tab='anam';UI.destSel=null;UI.msg='';UI.msg2='';render();return}
  if(!G||G.over)return;
  const P=cur();
  if(k==='dil'){resolveDil(+v);render();return}
  if(G.modal)return;
  UI.msg='';UI.msg2='';
  if(k==='pick'){pick(v);UI.destSel=null;UI.tab='anam'}
  else if(k==='tab'){UI.tab=v;if(P&&v==='ex')P.newRes=0}
  else if(k==='wait')adv(+v);
  else if(k==='finish')endShift();
  else if(!P)return;
  else if(k==='ask')askQ(P,v);
  else if(k==='proc'){UI.msg=doProc(P,v)||''}
  else if(k==='mov'){UI.msg2=doMov(P,v)||''}
  else if(k==='sys')exam(P,v);
  else if(k==='vit')vitals(P);
  else if(k==='reav')reassess(P);
  else if(k==='ord'){UI.msg=order(P,v)||'';if(UI.msg){UI.msg2=UI.msg;UI.msg=''}}
  else if(k==='rxgo'){const F=UI.F;UI.msg=rxAdd(P,{drug:F.drug,dose:F.dose,via:F.via,freq:F.freq,dur:F.dur,dil:F.dil,inf:F.inf})||'';if(!UI.msg){UI.F={drug:'',dose:0,via:0,freq:'',dur:'',dil:'',inf:''}}}
  else if(k==='dest')UI.destSel=v;
  else if(k==='commit'){const r=commit(P,UI.destSel);if(r)UI.msg2=r;else{UI.destSel=null;sfx('stamp')}}
  if(G&&G.over){render();return}
  render();
});

/* ===== TRILHA SONORA (chiptune em Web Audio, sem arquivos) =====
 Cada faixa é uma música com seções (introdução, tema, variação com melodia, ponte, retorno e final) e dura de 3:30 a 4:00.
 No modo automático: "Corredor Vazio" sem paciente na mesa; faixas neutras se revezam com paciente na mesa;
 "Sala Vermelha" só quando o paciente está na sala vermelha; "Passagem de Plantão" no relatório. A trilha nunca revela gravidade escondida. */
const MUS={on:true,next:0,bus:null,noise:null,sel:'auto',cur:null,pos:{},calmIdx:0};
try{MUS.sel=localStorage.getItem('pr_trk')||'auto'}catch(e){}
const hz=n=>440*Math.pow(2,(n-69)/12);
const CH={Am:[0,3,7],A:[0,4,7],F:[-4,0,3],C:[3,7,10],G:[-2,2,5],E:[-5,-1,2],Em:[-5,-2,2],Dm:[5,8,12],D:[5,9,12],Bb:[1,5,8],Eb:[6,10,13],Fm7:[-4,-1,3],Gm:[-2,1,5],Bm:[2,5,9]};
const _=null;
const pat=m=>{const a=Array(16).fill(_);Object.keys(m).forEach(k=>a[+k]=m[k]);return a};
const MINOR=[0,2,3,5,7,8,10],MAJOR=[0,2,4,5,7,9,11],MIXO=[0,2,4,5,7,9,10];
const TRACKS=[
 {id:'corredor',name:'Corredor Vazio',mood:'idle',bpm:58,scale:MINOR,

  form:['A','B','A','K','B','A']},
 {id:'madrugada',name:'Plantão de Madrugada',mood:'calm',bpm:76,scale:MINOR,motif:[[0,3],[4,2],[6,2],[8,6],[14,2]],
  base:{pad:.012,padType:'sine',bass:pat({0:0,8:0}),bl:6,bassVol:.045,bassType:'sine',arp:pat({0:0,4:2,8:1,12:2}),arpOct:24,arpType:'triangle',arpVol:.016,leadType:'triangle',leadVol:.02,leadOct:36},
  sec:{I:{p:['Am','Am','F','F'],arp:_},A:{p:['Am','Am','F','F']},A2:{p:['Am','Am','F','F'],lead:1},B:{p:['C','G','Am','Am'],lead:1,hat:[4,12]},K:{p:['F','G','Em','Am'],arp:_,lead:1,leadType:'sine'},O:{p:['Am','F','Am','Am'],arp:pat({0:0,8:2})}},
  form:['A','A2','B','K','A2','B']},
 {id:'vale',name:'Vale do São Francisco',mood:'calm',bpm:70,scale:MINOR,motif:[[0,2],[2,2],[4,4],[10,2],[12,4]],
  base:{pad:.01,padType:'triangle',bass:pat({0:0,8:0,12:12}),bl:4,bassVol:.04,bassType:'square',arp:pat({0:0,2:1,4:2,6:1,8:0,10:1,12:2,14:1}),arpOct:24,arpType:'sine',arpVol:.018,hat:[4,12],leadType:'sine',leadVol:.022,leadOct:36},
  sec:{I:{p:['Dm','C','Bb','Am'],arp:_,hat:_},A:{p:['Dm','C','Bb','Am']},A2:{p:['Dm','C','Bb','Am'],lead:1},B:{p:['F','C','Gm','Am'],lead:1},K:{p:['Bb','Bb','Am','Am'],arp:_,hat:_,lead:1,pad:.016},O:{p:['Dm','C','Bb','Am'],hat:_}},
  form:['A','A2','B','A2','K','B']},
 {id:'baiao',name:'Baião da Triagem',mood:'calm',bpm:88,scale:MIXO,motif:[[0,2],[3,2],[6,2],[8,1],[10,2],[13,3]],
  base:{bass:pat({0:0,6:0,10:0}),bl:2,bassVol:.05,bassType:'triangle',arp:pat({0:0,3:1,6:2,8:0,11:1,13:2}),arpOct:24,arpType:'triangle',arpVol:.017,hat:[2,6,10,14],kick:[0,10],kickVol:.1,leadType:'square',leadVol:.012,leadOct:36},
  sec:{I:{p:['G','G','C','G'],arp:_,kick:_},A:{p:['G','F','G','C']},A2:{p:['G','F','G','C'],lead:1},B:{p:['C','Bb','F','G'],lead:1},K:{p:['F','F','G','G'],arp:_,hat:[4,12],lead:1,leadType:'triangle',leadVol:.02},O:{p:['G','F','G','G'],kick:[0]}},
  form:['A','A2','B','A2','K','B']},
 {id:'prontuario',name:'Prontuário em Branco',mood:'calm',bpm:64,scale:MAJOR,motif:[[0,4],[4,4],[8,6],[14,2]],

  sec:{I:{p:['C','Em','Am','F'],arp:_},A:{p:['C','Em','Am','F']},A2:{p:['C','Em','Am','F'],lead:1},B:{p:['Dm','G','C','Am'],lead:1},K:{p:['F','G','Am','Am'],arp:_,lead:1,pad:.02},O:{p:['C','Em','F','C']}},
  form:['A','A2','B','K','A2','B']},
 {id:'vermelha',name:'Sala Vermelha',mood:'tense',bpm:112,scale:MINOR,motif:[[0,2],[2,2],[4,4],[8,2],[10,2],[12,4]],
  base:{bass:pat({0:0,2:0,4:0,6:12,8:0,10:0,12:0,14:12}),bl:1.5,bassVol:.06,bassType:'square',arp:[0,1,2,1,0,1,2,1,0,1,2,1,0,1,2,1],arpOct:24,arpType:'square',arpVol:.012,hat:[2,6,10,14],kick:[0,8],kickVol:.22,leadType:'sawtooth',leadVol:.01,leadOct:36},
  sec:{I:{p:['Am','Am','Am','Am'],arp:_},A:{p:['Am','Am','F','E']},A2:{p:['Am','Am','F','E'],lead:1},B:{p:['Dm','Dm','E','E'],lead:1},K:{p:['F','F','E','E'],arp:_,kick:[0,4,8,12]},O:{p:['Am','F','E','Am']}},
  form:['A','A2','B','K','A2','B']},
 {id:'passagem',name:'Passagem de Plantão',mood:'end',bpm:68,scale:MAJOR,motif:[[0,4],[4,2],[6,2],[8,8]],
  base:{pad:.02,padType:'sine',bass:pat({0:0,8:0}),bl:7,bassVol:.05,bassType:'sine',arp:pat({0:0,3:1,6:2,9:1,12:0}),arpOct:24,arpType:'triangle',arpVol:.02,bell:.1,leadType:'triangle',leadVol:.02,leadOct:36},
  sec:{I:{p:['C','G','Am','F'],arp:_},A:{p:['C','G','Am','F']},A2:{p:['C','G','Am','F'],lead:1},B:{p:['F','G','C','C'],lead:1},K:{p:['Am','F','G','G'],arp:_,lead:1},O:{p:['F','G','C','C']}},
  form:['A','A2','B','K','A2','B']},
 {id:'codigo',name:'Código Azul',mood:'manual',bpm:138,scale:MINOR,motif:[[0,2],[4,2],[8,2],[12,4]],
  base:{bass:Array(16).fill(0),bl:.8,bassVol:.05,bassType:'sawtooth',arp:pat({0:2,2:1,4:0,6:1,8:2,10:1,12:0,14:1}),arpOct:36,arpType:'square',arpVol:.014,hat:[1,3,5,7,9,11,13,15],kick:[0,2,8,10],kickVol:.26,alarm:1,leadType:'square',leadVol:.01,leadOct:36},
  sec:{I:{p:['Am','Am','Bb','Bb'],arp:_},A:{p:['Am','Bb','Am','Eb']},A2:{p:['Am','Bb','Am','Eb'],lead:1},B:{p:['Dm','Eb','E','E'],lead:1},K:{p:['Am','Am','Bb','Bb'],arp:_,hat:[2,6,10,14]},O:{p:['Am','Bb','E','Am']}},
  form:['A','A2','B','K','A2','B']}
];
const MOODLBL={idle:'sem paciente',calm:'neutra',tense:'sala vermelha',end:'relatório',manual:'só manual'};
/* monta a música: introdução + seções em ciclo até 3:30, sem passar de 4:00, + final */
function buildTrack(T){
  const barS=240/T.bpm,arr=[];
  const push=(k,reps,v)=>{const S=Object.assign({},T.base,T.sec[k]);for(let r=0;r<reps;r++)S.p.forEach((ch,bi)=>arr.push({ch,S,k,v,bi:bi+r*S.p.length}))};
  push('I',1,0);let i=0;
  while((arr.length+4)*barS<210&&i<80){const k=T.form[i%T.form.length],n=T.sec[k].p.length,reps=(arr.length+2*n+4)*barS<=240?2:1;push(k,reps,Math.floor(i/T.form.length));i++}
  push('O',1,0);return arr;
}
TRACKS.forEach(T=>{T._arr=buildTrack(T);T._dur=T._arr.length*240/T.bpm});
/* melodia: frases de 4 compassos que se repetem quando a seção volta, com variação no retorno e cadência no fim da frase */
function leadNotes(T,d){
  const ch=CH[d.ch],sc=T.scale,r=mulb(hashS(T.id+d.k+(d.bi%4)+(d.v%2?'b':'a')));
  const out=(T.motif||[[0,4],[8,4]]).map(([p,l],j,M)=>{let n;
    if(j===0||r()<.55)n=ch[Math.floor(r()*ch.length)];else{n=ch[0]+sc[Math.floor(r()*sc.length)];if(n>ch[0]+12)n-=12}
    if(d.bi%4===3&&j===M.length-1){n=ch[0];l+=2}return[p,l,n,r()]});
  return out.filter(x=>x[3]>.15);
}
function moodNow(){
  if(!G)return'idle';if(G.over)return'end';
  const P=cur();if(!P)return'idle';
  return P.st==='emg'?'tense':'calm';
}
function wantTrack(){
  if(MUS.sel!=='auto'&&TRACKS.some(t=>t.id===MUS.sel))return MUS.sel;
  const m=moodNow();
  if(m==='calm'){const L=TRACKS.filter(t=>t.mood==='calm');return L[MUS.calmIdx%L.length].id}
  return TRACKS.find(t=>t.mood===m).id;
}
function startTrack(id){
  if(MUS.cur)MUS.pos[MUS.cur.T.id]=MUS.cur.bar;
  const T=TRACKS.find(t=>t.id===id);
  MUS.cur={T,arr:T._arr,bar:MUS.pos[id]||0,s:0,lead:[]};
}
function musSelect(v){
  MUS.sel=v;try{localStorage.setItem('pr_trk',v)}catch(e){}
  if(v!=='auto')delete MUS.pos[v];
  if(MUS.cur)startTrack(wantTrack());
}
function mv(f,t,d,type,vol,att){
  try{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+(att||.008));g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(MUS.bus);o.start(t);o.stop(t+d+.05)}catch(e){}
}
function mnoise(t,d,vol,freq,type){
  try{if(!MUS.noise){const n=AC.sampleRate,b=AC.createBuffer(1,n,n),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;MUS.noise=b}
    const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=MUS.noise;s.loop=d>1;f.type=type||'highpass';f.frequency.value=freq;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(MUS.bus);s.start(t);s.stop(t+d+.05)}catch(e){}
}
function playStep(t){
  const C=MUS.cur,T=C.T,d=C.arr[C.bar],S=d.S,s=C.s,sp=60/T.bpm/4,ch=CH[d.ch],root=45;
  if(s===0&&S.pad)ch.forEach(n=>mv(hz(root+12+n),t,sp*16*1.05,S.padType||'sine',S.pad,sp*4));
  if(s===0&&S.hum)mnoise(t,sp*16,S.hum,320,'lowpass');
  if(S.bass&&S.bass[s]!=null)mv(hz(root+ch[0]+S.bass[s]),t,sp*(S.bl||2),S.bassType||'sine',S.bassVol||.05);
  if(S.arp&&S.arp[s]!=null)mv(hz(root+(S.arpOct||24)+ch[S.arp[s]%ch.length]),t,sp*1.6,S.arpType||'triangle',S.arpVol||.02);
  if(S.lead){if(s===0)C.lead=leadNotes(T,d);C.lead.forEach(([p,l,n])=>{if(p===s)mv(hz(root+(S.leadOct||36)+n),t,sp*l*.95,S.leadType||'triangle',S.leadVol||.02,.01)})}
  if(S.hat&&S.hat.includes(s))mnoise(t,.04,.03,7000);
  if(S.kick&&S.kick.includes(s)){try{const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(S.kickVol||.15,t);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(MUS.bus);o.start(t);o.stop(t+.2)}catch(e){}}
  if(S.bell&&s===8&&Math.random()<S.bell*4)mv(hz(root+36+ch[Math.floor(Math.random()*ch.length)]),t,2.4,'sine',.03,.005);
  if(S.alarm&&s===0&&C.bar%2===0)mv(hz(root+54),t,sp*2,'square',.012);
}
function musTick(){
  if(!AC||!UI.snd||!MUS.on||AC.state!=='running')return;
  if(!MUS.bus){MUS.bus=AC.createGain();MUS.bus.gain.value=.55;MUS.bus.connect(AC.destination)}
  if(!MUS.cur)startTrack(wantTrack());
  const now=AC.currentTime;if(MUS.next<now-.25)MUS.next=now+.05;
  while(MUS.next<now+.15){
    if(MUS.cur.s===0){const w=wantTrack();if(w!==MUS.cur.T.id)startTrack(w)}
    playStep(MUS.next);
    const C=MUS.cur;MUS.next+=60/C.T.bpm/4;C.s++;
    if(C.s>=16){C.s=0;C.bar++;if(C.bar>=C.arr.length){C.bar=0;
      if(MUS.sel==='auto'&&C.T.mood==='calm'){MUS.calmIdx++;delete MUS.pos[C.T.id];MUS.pos[C.T.id]=0}}}
  }
}
const mmss=x=>Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0');
function npText(){
  if(!MUS.on||!UI.snd)return'Música pausada';
  const C=MUS.cur;if(!C)return'Clique em qualquer lugar para tocar';
  const el=(C.bar+C.s/16)*240/C.T.bpm;return C.T.name+' · '+mmss(el)+' / '+mmss(C.T._dur);
}
function trackSelectHtml(){
  return'<option value="auto"'+(MUS.sel==='auto'?' selected':'')+'>Automática (conforme o plantão)</option>'
    +TRACKS.map(t=>'<option value="'+t.id+'"'+(MUS.sel===t.id?' selected':'')+'>'+t.name+' ('+MOODLBL[t.mood]+', '+mmss(t._dur)+')</option>').join('');
}
setInterval(musTick,30);
setInterval(()=>{const e=document.getElementById('np');if(e)e.textContent=npText()},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&MUS.bus){MUS.next=0}});
